# Copy to .laravel-kit.conf at the root of your Laravel repository and commit
# it, so the whole team runs the same gates. Every line is optional; the
# values shown are the defaults. The file is parsed as KEY=value lines, never
# executed. Commands are split on spaces, so a path must not contain one.

# Where the deploy check compares HEAD. When unset, the remote's default
# branch (refs/remotes/origin/HEAD) is used, then main.
# PROTECTED_BRANCH=main
# REMOTE=origin

# git fetch REMOTE PROTECTED_BRANCH before comparing. off compares against
# the last fetch, for offline work.
# FETCH=on

# Tool commands, run from the repository root.
# PINT=vendor/bin/pint
# PHPSTAN=vendor/bin/phpstan
# PHPSTAN_MEMORY_LIMIT=1G

# The suite the deploy check runs. When unset: php artisan test if there is an
# artisan file, else vendor/bin/pest, else vendor/bin/phpunit.
# TEST_COMMAND=php artisan test --parallel

# Deploy-check steps to skip: pint, phpstan, tests, boot, git (comma-separated).
# A skipped step is reported as SKIP and named again next to the verdict.
# SKIP=

# The commit hook. off disables it in this repository.
# FAST_GATE=on
# Fast-gate checks to skip: pint, phpstan.
# FAST_GATE_SKIP=
